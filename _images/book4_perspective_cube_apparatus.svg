    <text class="euclid-label" data-ref="F_BL" x="268.91" y="367.22" text-anchor="middle">A&#x27;</text>
    <text class="euclid-label" data-ref="F_BR" x="463.67" y="368.69" text-anchor="middle">B&#x27;</text>
