    <text class="euclid-label" data-ref="B_TL" x="315.27" y="160.73" text-anchor="middle">H&#x27;</text>
    <text class="euclid-label" data-ref="V_x" x="508.37" y="127.85" text-anchor="middle">V<tspan class="euclid-sub" dy="3">x</tspan></text>
    <text class="euclid-label" data-ref="M_depth" x="293" y="342.98" text-anchor="middle">M&#x27;</text>
    <text class="caption-note" x="370" y="497.5" text-anchor="middle">Book IV, Figs. 56–63 — Glass Picture Plane Projection (CR(A&#x27;, E&#x27;; M&#x27;, V_x) = -1)</text>
  </g>
</svg>
