    <polygon class="geom-polygon durer-poly" data-ref="&lt; F_BL F_BR F_TR F_TL &gt;" points="280.1,352.5 454.1,352.5 454.1,178.5 280.1,178.5"/>
    <polygon class="geom-polygon" data-ref="&lt; B_BL B_BR B_TR B_TL &gt;" points="323.6,309 462.8,309 462.8,169.8 323.6,169.8"/>
  </g>
  <g class="layer-circles">
  </g>
  <g class="layer-lines">
    <path class="geom-line ray-line" data-ref="[ F_BL B_BL ]" d="M 126.4 506.2 L 355.5 277.1 L 584.6 48"/>
    <path class="geom-line ray-line" data-ref="[ F_BR B_BR ]" d="M 422.2 512 L 468.6 280 L 515 48"/>
    <path class="geom-line ray-line" data-ref="[ F_TL B_TL ]" d="M 126.4 209.24 L 370 160.52 L 613.6 111.8"/>
  </g>
  <g class="layer-segments">
    <path class="geom-segment" data-ref="/ F_BL B_BL /" d="M 280.1 352.5 L 301.85 330.75 L 323.6 309"/>
    <path class="geom-segment" data-ref="/ F_BR B_BR /" d="M 454.1 352.5 L 458.45 330.75 L 462.8 309"/>
    <path class="geom-segment" data-ref="/ F_TR B_TR /" d="M 454.1 178.5 L 458.45 174.15 L 462.8 169.8"/>
    <path class="geom-segment" data-ref="/ F_TL B_TL /" d="M 280.1 178.5 L 301.85 174.15 L 323.6 169.8"/>
    <path class="geom-segment sector-seg" data-ref="/ B_BL V_x /" d="M 323.6 309 L 410.6 222 L 497.6 135"/>
    <path class="geom-segment sector-seg" data-ref="/ B_BR V_x /" d="M 462.8 309 L 480.2 222 L 497.6 135"/>
    <path class="geom-segment sector-seg" data-ref="/ B_TR V_x /" d="M 462.8 169.8 L 480.2 152.4 L 497.6 135"/>
    <path class="geom-segment sector-seg" data-ref="/ B_TL V_x /" d="M 323.6 169.8 L 410.6 152.4 L 497.6 135"/>
  </g>
  <g class="layer-points">
    <circle class="geom-point" data-ref="F_BL" data-aliases="F_BL,A&#x27;" data-latex-x="- \frac{3}{4}" data-latex-y="\frac{5}{4}" cx="280.1" cy="352.5" r="3.7"><title>A&#x27;: (- \frac{3}{4}, \frac{5}{4})</title></circle>
    <circle class="geom-point" data-ref="F_BR" data-aliases="F_BR,B&#x27;" data-latex-x="\frac{9}{4}" data-latex-y="\frac{5}{4}" cx="454.1" cy="352.5" r="3.7"><title>B&#x27;: (\frac{9}{4}, \frac{5}{4})</title></circle>
    <circle class="geom-point" data-ref="F_TR" data-aliases="F_TR,C&#x27;" data-latex-x="\frac{9}{4}" data-latex-y="\frac{17}{4}" cx="454.1" cy="178.5" r="3.7"><title>C&#x27;: (\frac{9}{4}, \frac{17}{4})</title></circle>
    <circle class="geom-point" data-ref="F_TL" data-aliases="F_TL,D&#x27;" data-latex-x="- \frac{3}{4}" data-latex-y="\frac{17}{4}" cx="280.1" cy="178.5" r="3.7"><title>D&#x27;: (- \frac{3}{4}, \frac{17}{4})</title></circle>
    <circle class="geom-point" data-ref="B_BL" data-aliases="B_BL,E&#x27;" data-latex-x="0" data-latex-y="2" cx="323.6" cy="309" r="3.7"><title>E&#x27;: (0, 2)</title></circle>
    <circle class="geom-point" data-ref="B_BR" data-aliases="B_BR,F&#x27;" data-latex-x="\frac{12}{5}" data-latex-y="2" cx="462.8" cy="309" r="3.7"><title>F&#x27;: (\frac{12}{5}, 2)</title></circle>
    <circle class="geom-point" data-ref="B_TR" data-aliases="B_TR,G&#x27;" data-latex-x="\frac{12}{5}" data-latex-y="\frac{22}{5}" cx="462.8" cy="169.8" r="3.7"><title>G&#x27;: (\frac{12}{5}, \frac{22}{5})</title></circle>
    <circle class="geom-point" data-ref="B_TL" data-aliases="B_TL,H&#x27;" data-latex-x="0" data-latex-y="\frac{22}{5}" cx="323.6" cy="169.8" r="3.7"><title>H&#x27;: (0, \frac{22}{5})</title></circle>
    <circle class="geom-point accent-pt" data-ref="V_x" data-aliases="V_x,V_x" data-latex-x="3" data-latex-y="5" cx="497.6" cy="135" r="3.7"><title>V_x: (3, 5)</title></circle>
    <circle class="geom-point" data-ref="M_depth" data-aliases="M_depth,M&#x27;" data-latex-x="- \frac{1}{3}" data-latex-y="\frac{5}{3}" cx="304.27" cy="328.33" r="3.7"><title>M&#x27;: (- \frac{1}{3}, \frac{5}{3})</title></circle>
  </g>
